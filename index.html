<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Vishesh Workout Studio - a private, offline-friendly workout tracker. All data stays on your device.">
  <title>Vishesh Workout Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript><p style="padding:24px;color:#fff">Vishesh Workout Studio needs JavaScript enabled.</p></noscript>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">V</span>
      <div class="brand-text"><b>VISHESH</b><span>WORKOUT STUDIO</span></div>
    </div>
    <button class="icon-btn" data-action="openSettings" aria-label="Settings and backup" id="btn-settings"></button>
  </header>

  <main id="app">
    <div id="loading" class="loading">Loading…</div>
    <section id="view-home" class="view" data-view="home"></section>
    <section id="view-workouts" class="view" data-view="workouts"></section>
    <section id="view-music" class="view" data-view="music"></section>
    <section id="view-tracker" class="view" data-view="tracker"></section>
    <section id="view-progress" class="view" data-view="progress"></section>
  </main>

  <nav class="bottom-nav" id="nav" aria-label="Main navigation"></nav>

  <div id="session" class="session" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="update-banner" class="update-banner" hidden>
    <span>A new version of the app is ready.</span>
    <button class="btn btn-primary btn-sm" data-action="applyUpdate">Update now</button>
    <button class="btn btn-ghost btn-sm" data-action="dismissUpdate">Later</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Hidden file pickers (kept outside the views so re-rendering never destroys them) -->
  <input type="file" id="audio-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden>
  <input type="file" id="video-input" class="native-file-picker" accept="video/mp4,video/webm,video/*,.mp4,.m4v,.webm,.mov,.3gp,.mkv,.ogv" aria-label="Choose a video file" style="position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">
  <input type="file" id="import-input" accept="application/json,.json" hidden>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
